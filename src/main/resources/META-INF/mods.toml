modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="CityGen — Генератор зданий"
authors="${mod_authors}"
description='''
Внутриигровой генератор реалистичных зданий и целых кварталов.
4 стиля (современный, культурный, античный, фантастический), 8 типов зданий, 18 палитр,
формы (цилиндр, закрученная башня, уступы, двор-колодец), купола, фронтоны, мансарды,
интерьеры с мебелью, лестничные клетки, лифты, пожарные лестницы, парки, площади и дороги.

Нажмите G, чтобы открыть редактор. Поддержать автора — кнопка ♥ в редакторе.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
